<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Interface</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body data-theme="light">
    <div class="calculator-wrapper">

        <div class="calculator">
            <div class="header">
                <span class="history-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                        <path d="M12 7v5l4 2" />
                    </svg>
                </span>
                <div class="menu-container">
                    <span class="menu-icon" id="menu-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="1" />
                            <circle cx="12" cy="5" r="1" />
                            <circle cx="12" cy="19" r="1" />
                        </svg>
                    </span>
                    <div id="dropdown-menu" class="dropdown-menu">
                        <button id="theme-btn" class="theme-btn">Change Theme</button>
                    </div>
                </div>
            </div>
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
            <div class="controls">
                <span class="up-down-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m18 15-6 6-6-6" />
                        <path d="m6 9 6-6 6 6" />
                    </svg>
                </span>
            </div>
            <div class="buttons">
                <button class="btn btn-primary" data-action="clear">AC</button>
                <button class="btn btn-secondary" data-action="paren">( )</button>
                <button class="btn btn-secondary" data-action="percent">%</button>
                <button class="btn btn-secondary" data-action="operator" data-value="/">÷</button>
                <button class="btn btn-number" data-value="7">7</button>
                <button class="btn btn-number" data-value="8">8</button>
                <button class="btn btn-number" data-value="9">9</button>
                <button class="btn btn-secondary" data-action="operator" data-value="*">×</button>
                <button class="btn btn-number" data-value="4">4</button>
                <button class="btn btn-number" data-value="5">5</button>
                <button class="btn btn-number" data-value="6">6</button>
                <button class="btn btn-secondary" data-action="operator" data-value="-">−</button>
                <button class="btn btn-number" data-value="1">1</button>
                <button class="btn btn-number" data-value="2">2</button>
                <button class="btn btn-number" data-value="3">3</button>
                <button class="btn btn-secondary" data-action="operator" data-value="+">+</button>
                <button class="btn btn-number" data-value=".">.</button>
                <button class="btn btn-number" data-value="0">0</button>
                <button class="btn btn-number" data-action="backspace">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 9V7a2 2 0 0 0-2-2H8L2 12l6 7h8a2 2 0 0 0 2-2v-2" />
                        <line x1="15" y1="9" x2="9" y2="15" />
                        <line x1="9" y1="9" x2="15" y2="15" />
                    </svg>
                </button>
                <button class="btn btn-primary" data-action="calculate">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
